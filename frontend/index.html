<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Expense Tracker</a>
    </div>
  </nav>

  <div class="container position-relative">
    
    <div id="alert-container"></div>

    
    <div id="spinner" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    
    <div class="summary-cards-grid mb-4">
      <div class="card text-white bg-primary">
        <div class="card-body">
          <h5 class="card-title">Total Amount</h5>
          <p class="card-text fs-4" id="summary-total">$0.00</p>
        </div>
      </div>
      <div class="card text-white bg-success">
        <div class="card-body">
          <h5 class="card-title">Number of Expenses</h5>
          <p class="card-text fs-4" id="summary-count">0</p>
        </div>
      </div>
      <div class="card text-white bg-danger">
        <div class="card-body">
          <h5 class="card-title">Highest Expense</h5>
          <p class="card-text fs-4" id="summary-highest">$0.00</p>
        </div>
      </div>
    </div>

    
    <div class="row mb-3 align-items-center">
      <div class="col-md-6 mb-2 mb-md-0">
        <button id="btn-export-csv" class="btn btn-outline-secondary">Export to CSV</button>
      </div>
      <div class="col-md-6 d-flex justify-content-md-end">
        <div class="form-check form-switch d-flex align-items-center me-3">
          <input class="form-check-input me-2" type="checkbox" role="switch" id="dark-mode-toggle">
          <label class="form-check-label" for="dark-mode-toggle">Dark Mode</label>
        </div>
        <input type="text" id="search-title" class="form-control form-control-sm w-auto" placeholder="Search by title...">
      </div>
    </div>

    <div class="row">
     
      <div class="col-lg-4 mb-4">
        <div class="card">
          <div class="card-header">Add Expense</div>
          <div class="card-body">
            <form id="add-form">
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required>
              </div>
              <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" id="amount" required>
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" required>
                  <option value="" disabled selected>Select category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Add Expense</button>
            </form>
          </div>
        </div>
      </div>

      
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>Expenses</span>
            <div class="d-flex align-items-center">
              <label for="filter-category" class="me-2 mb-0">Filter:</label>
              <select class="form-select form-select-sm" id="filter-category" style="width: auto;">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped table-hover mb-0">
                <thead>
                  <tr>
                    <th style="cursor: pointer;" onclick="sortTable('title')">Title &#x21D5;</th>
                    <th style="cursor: pointer;" onclick="sortTable('amount')">Amount &#x21D5;</th>
                    <th style="cursor: pointer;" onclick="sortTable('category')">Category &#x21D5;</th>
                    <th style="cursor: pointer;" onclick="sortTable('date')">Date &#x21D5;</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="expenses-table-body">
                 
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-form">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" class="form-control" id="edit-title" required>
            </div>
            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" id="edit-amount" required>
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select class="form-select" id="edit-category" required>
                <option value="" disabled>Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" class="form-control" id="edit-date" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
